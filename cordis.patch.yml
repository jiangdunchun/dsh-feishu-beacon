# The dsh-feishu-beacon bundle layer: one host row carrying the tool registry,
# the global session-event hooks, the settings namespace, and the two HTTP
# routes the settings page talks to.
#
# This `config:` block is the composition BASE layer. Anything the settings page
# writes lands on this row in the active profile's cordis.patch.yml and
# overrides these values field by field. Keep real webhook URLs OUT of this
# file: it ships inside the npm tarball.

- insert:
    - id: dsh-feishu-beacon
      name: dsh-feishu-beacon
      config:
        webhookUrl: ''
        secret: ''
        enabled: true
        prefix: ''
        notifyQuestion: true
        notifyApproval: true
        notifyError: true
        # A card carries more before it stops being readable on a phone, so the
        # budget is wider than the plain-text default it replaced.
        maxChars: 3000
        # Not offered in the settings form, because a refused card already falls
        # back to text on its own and choosing by hand only removes the attempt.
        # Set `text` here to stop trying cards at all.
        format: card
        publicUrl: ''
